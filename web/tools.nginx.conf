# aicmd / jptxt / mdview downloads — https://whatamieatingtoday.com/app/tools/
# Installed as /etc/nginx/snippets/tools.conf, included next to jptxt.conf in the vhost.
location = /app/tools { return 301 /app/tools/; }
location /app/tools/ {
    alias /var/www/apps/tools/;
    index index.html;
    types {
        text/html html htm;
        image/x-icon ico;
    }
    default_type application/octet-stream;
    add_header X-Robots-Tag "noindex" always;
}
